<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5,500;87.5,700;100,500;100,700;100,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#0B0E17; --navy:#121828; --navy-2:#182036; --line:#242C44; --line-soft:#1B2338;
  --text:#F2EFE9; --muted:#9AA3B8; --muted-2:#6B7490;
  --red:#E00808; --red-deep:#9E0606; --red-soft:rgba(224,8,8,.14);
  --blue:#4F8CFF; --blue-soft:rgba(79,140,255,.16);
  --paper:#EEEDE8; --paper-2:#E3E1DA; --paper-ink:#0B0E17; --paper-muted:#5B6275; --paper-line:#D2D0C8;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --max:1180px; --gut:24px; --r:6px;
}
*{box-sizing:border-box}
html:not(.lenis){scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--red);flex:none}
.hl{color:var(--red)}
.section{padding:96px 0}
.section h2{font-size:clamp(30px,4.2vw,50px);line-height:1.04;font-weight:700;margin-top:18px;max-width:18ch}
.lead{color:var(--muted);font-size:18px;max-width:58ch;margin:18px 0 0}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--body);font-weight:600;font-size:15px;padding:14px 22px;border-radius:var(--r);border:1px solid transparent;cursor:pointer;transition:transform .15s ease,background .15s ease,border-color .15s ease}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:#F51212}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(11,14,23,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand svg,.brand img{width:34px;height:auto;flex:none}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.16em;color:var(--muted);margin-top:2px}
.links{display:flex;gap:28px;font-size:14.5px;font-weight:500;color:var(--muted)}
.links a:hover{color:var(--text)}
.nav .btn{padding:10px 16px;font-size:14px}
.menu{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:var(--r);padding:8px 10px}

/* hero */
.hero{position:relative;overflow:hidden;padding:72px 0 80px;border-bottom:1px solid var(--line-soft)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center;position:relative;z-index:2}
.hero h1{font-size:clamp(40px,6vw,74px);line-height:.98;font-weight:800;margin-top:22px}
.hero .lead{font-size:19px;max-width:48ch}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero-meta{display:flex;gap:26px;margin-top:38px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.hero-meta b{display:block;color:var(--text);font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
#gl{position:absolute;inset:0;z-index:1;pointer-events:none}
.hero-glow{position:absolute;right:-10%;top:-20%;width:60%;height:140%;z-index:0;background:radial-gradient(ellipse at 60% 45%,rgba(79,140,255,.16),transparent 55%),radial-gradient(ellipse at 40% 70%,rgba(224,8,8,.14),transparent 50%)}

/* before-after */
.ba{position:relative;aspect-ratio:288/413;max-height:560px;margin:0 auto;border-radius:10px;overflow:hidden;background:#1c2236;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px var(--line);user-select:none}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .after{clip-path:inset(0 0 0 var(--x,50%))}
.ba .bar{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:#fff;transform:translateX(-1px);pointer-events:none}
.ba .knob{position:absolute;top:50%;left:var(--x,50%);width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);transform:translate(-50%,-50%);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.tag{position:absolute;top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:6px 9px;border-radius:4px;pointer-events:none}
.tag.l{left:14px;background:rgba(11,14,23,.72);color:var(--text)}
.tag.r{right:14px;background:var(--blue);color:#fff}
.ba-cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:12px;letter-spacing:.04em}

/* proof band */
.proof{background:var(--paper);color:var(--paper-ink);padding:56px 0}
.proof .eyebrow{color:var(--paper-muted)}
.logos{display:flex;flex-wrap:wrap;gap:12px 34px;align-items:center;margin-top:22px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;color:#2A3044}
.logos span{opacity:.72;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:44px;border-top:1px solid var(--paper-line)}
.stat{padding:26px 22px 0 0;border-right:1px solid var(--paper-line);margin-right:22px}
.stat:last-child{border-right:0;margin-right:0}
.stat b{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1;display:block;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;color:var(--red)}
.stat span{display:block;color:var(--paper-muted);font-size:14px;margin-top:8px;max-width:22ch}

/* why */
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:56px;position:relative}
.ladder::before{content:"";position:absolute;left:0;right:0;top:15px;height:1px;background:linear-gradient(90deg,var(--line) 0,var(--line) 75%,var(--blue) 100%)}
.step{position:relative;padding:0 24px 0 0}
.step i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--ink);font-family:var(--mono);font-style:normal;font-size:12px;color:var(--muted);position:relative}
.step:last-child i{background:var(--blue);border-color:var(--blue);color:#fff}
.step h3{font-size:19px;font-weight:700;margin-top:18px}
.step:last-child h3{color:var(--blue)}
.step p{color:var(--muted);margin:6px 0 0;font-size:14.5px}
.step small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted-2);letter-spacing:.1em;margin-top:14px}
.costs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:64px}
.cost{background:var(--navy);border:1px solid var(--line-soft);border-radius:var(--r);padding:22px}
.cost b{font-family:var(--display);font-size:18px;font-weight:700;display:block}
.cost p{margin:8px 0 0;color:var(--muted);font-size:14.5px}
.cost .arrow{color:var(--red);font-family:var(--mono);font-size:12px;letter-spacing:.1em;display:block;margin-bottom:14px}

/* services */
.services{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:52px}
.services .svc{background:var(--navy);border:1px solid var(--line-soft);border-radius:8px;padding:28px;display:grid;grid-template-columns:1fr 200px;gap:24px;transition:border-color .2s,transform .2s}
.services .svc:hover{border-color:var(--line);transform:translateY(-2px)}
.services .svc .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted-2)}
.services .svc h3{font-size:28px;font-weight:700;margin-top:12px}
.services .svc .promise{color:var(--muted);margin:8px 0 18px;font-size:15.5px}
.services .svc ul{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:14.5px}
.services .svc li{display:flex;gap:10px}
.services .svc li::before{content:"";width:5px;height:5px;background:var(--red);border-radius:50%;flex:none;margin-top:9px}
.services .svc .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft)}
.services .svc .nums div{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.services .svc .nums b{display:block;font-family:var(--display);font-size:19px;color:var(--text);letter-spacing:-.02em;margin-bottom:3px}
.services .svc .more{display:inline-flex;gap:8px;align-items:center;margin-top:20px;font-weight:600;font-size:14.5px;color:var(--text)}
.services .svc .more:hover{color:#fff;text-decoration:underline;text-underline-offset:4px}
.vis{border-radius:6px;overflow:hidden;background:var(--navy-2);border:1px solid var(--line-soft);align-self:start}
.vis.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.vis.pair img{aspect-ratio:288/413;object-fit:cover;width:100%}
.vis.pair figure{margin:0;position:relative}
.vis.pair figcaption{position:absolute;bottom:6px;left:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:3px 6px;border-radius:3px;background:rgba(11,14,23,.75)}
.vis.pair figure:last-child figcaption{background:var(--blue);color:#fff}
.mock{padding:14px;font-size:11px;font-family:var(--mono);color:var(--muted)}
.mock .row{display:flex;gap:6px;margin-bottom:6px}
.mock .box{background:var(--line-soft);border-radius:3px;height:34px;flex:1}
.mock .box.img{height:70px;background:linear-gradient(135deg,#243052,#1a2238)}
.mock .t{height:8px;border-radius:2px;background:#2E3855;margin:6px 0}
.mock .t.short{width:55%}
.mock .ok{color:#7CD992}
.mock .bad{color:#FF6B6B}
.mock .line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-soft)}

/* work */
.work{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:48px}
.tile{position:relative;border-radius:8px;overflow:hidden;background:var(--navy);border:1px solid var(--line-soft)}
.tile>img{aspect-ratio:288/413;object-fit:cover;width:100%;transition:transform .5s ease}
.tile:hover>img{transform:scale(1.03)}
.tile .inset{position:absolute;top:10px;left:10px;width:26%;border-radius:4px;border:1px solid rgba(255,255,255,.35);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 12px;background:linear-gradient(transparent,rgba(11,14,23,.9));font-size:13px;display:flex;justify-content:space-between;align-items:baseline}
.tile .cap small{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em}

/* process */
.process{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:52px}
.pstep{padding:18px 16px 20px;border-top:2px solid var(--line);position:relative}
.pstep.hot{border-top-color:var(--red);background:linear-gradient(180deg,var(--red-soft),transparent 80%)}
.pstep i{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--muted-2);letter-spacing:.1em}
.pstep h3{font-size:19px;margin-top:10px}
.pstep p{color:var(--muted);font-size:14px;margin:6px 0 0}
.need{margin-top:40px;background:var(--navy);border:1px solid var(--line-soft);border-radius:8px;padding:26px 28px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}

/* quotes */
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.quote{background:var(--navy);border:1px solid var(--line-soft);border-radius:8px;padding:26px;display:flex;flex-direction:column;gap:18px}
.quote p{margin:0;font-size:15.5px;line-height:1.6;color:var(--text)}
.quote p::before{content:"“";color:var(--red);font-family:var(--display);font-size:34px;line-height:0;vertical-align:-10px;margin-right:4px}
.quote footer{font-size:13.5px;color:var(--muted);margin-top:auto}
.quote footer b{display:block;color:var(--text);font-weight:600}

/* pilot */
.pilot{background:var(--paper);color:var(--paper-ink)}
.pilot .eyebrow{color:var(--paper-muted)}
.pilot .lead{color:var(--paper-muted)}
.pilot-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
.pilot ol{margin:30px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:14px}
.pilot ol li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start}
.pilot ol li::before{content:counter(s,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--red);padding-top:4px}
.pilot ol b{display:block;font-family:var(--display);font-size:18px}
.pilot ol span{color:var(--paper-muted);font-size:14.5px}
.picker{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:26px;box-shadow:0 20px 60px rgba(11,14,23,.08)}
.picker .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--paper-muted)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 20px}
.chip{border:1px solid var(--paper-line);border-radius:var(--r);padding:14px;cursor:pointer;font-family:var(--body);font-weight:600;font-size:14.5px;color:var(--paper-ink);text-align:left;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;transition:border-color .15s,background .15s;background:#fff}
.chip small{display:block;font-weight:400;color:var(--paper-muted);font-size:12.5px;margin-top:3px;font-family:var(--body)}
.chip[aria-pressed="true"]{border-color:var(--red);background:#FFF3F3}
.chip::after{content:"";width:10px;height:10px;border-radius:50%;border:1px solid var(--paper-line);background:#fff}
.chip[aria-pressed="true"]::after{background:var(--red);border-color:var(--red)}
.chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.picker .btn{width:100%;justify-content:center}
.picker p{font-size:13px;color:var(--paper-muted);margin:12px 0 0;text-align:center}

/* footer */
.foot{border-top:1px solid var(--line-soft);padding:44px 0 36px;color:var(--muted);font-size:14px}
.foot .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
.foot .brand{color:var(--text)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.foot a:hover{color:var(--text)}
.foot .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted-2);margin-bottom:12px;display:block}
.foot-mail{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:11px 16px;border-radius:var(--r);border:1px solid var(--line);background:rgba(242,239,233,.04);color:var(--text);font-family:var(--body);font-weight:600;font-size:14.5px;transition:border-color .15s,background .15s}
.foot-mail:hover{border-color:var(--red);background:var(--red-soft)}
.foot-mail svg{width:18px;height:18px;color:var(--red);flex:none}
.foot .legal{grid-column:1/-1;border-top:1px solid var(--line-soft);padding-top:18px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted-2);flex-wrap:wrap;gap:8px}

@media (max-width:1024px){
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:0}
  .stat{padding-bottom:22px}
  .ladder,.costs{grid-template-columns:1fr 1fr;gap:28px 24px}
  .ladder::before{display:none}
  .process{grid-template-columns:repeat(3,1fr)}
  .work{grid-template-columns:1fr 1fr}
  .quotes{grid-template-columns:1fr}
}
@media (max-width:860px){
  .links,.nav .btn{display:none}
  .menu{display:block}
  .hero{padding:48px 0 56px}
  .hero .wrap{grid-template-columns:1fr;gap:40px}
  .ba{max-height:none;max-width:360px}
  .services{grid-template-columns:1fr}
  .services .svc{grid-template-columns:1fr}
  .vis{max-width:320px}
  .pilot-grid{grid-template-columns:1fr;gap:36px}
  .need{grid-template-columns:1fr;gap:16px}
  .foot .wrap{grid-template-columns:1fr 1fr}
  .section{padding:72px 0}
}
@media (max-width:560px){
  .process{grid-template-columns:1fr 1fr}
  .work{grid-template-columns:1fr 1fr;gap:10px}
  .chips{grid-template-columns:1fr}
  .hero-meta{gap:18px;flex-wrap:wrap}
  .foot .wrap{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .tile>img,.services .svc,.btn{transition:none}
}

/* v2: hero mosaic */
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:150px;gap:10px;position:relative}
.mosaic>*{border-radius:8px;overflow:hidden;position:relative;background:var(--navy);border:1px solid var(--line-soft);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.mosaic img{width:100%;height:100%;object-fit:cover}
.mosaic .tall{grid-row:span 2}
.mosaic .wide{grid-column:span 2}
.mosaic .lbl{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;padding:4px 7px;border-radius:3px;background:rgba(11,14,23,.78);color:var(--text)}
.mosaic .lbl.blue{background:var(--blue);color:#fff}
.reel{background:linear-gradient(160deg,#1b2340,#0f1424);display:grid;place-items:center}
.reel .play{width:44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px rgba(224,8,8,.45)}
.reel .play svg{width:16px;height:16px;margin-left:2px}
.aplus{padding:12px;display:grid;gap:8px;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.aplus .band{height:38px;border-radius:3px;background:linear-gradient(90deg,#2a3556,#1b2340);border:1px solid var(--line)}
.aplus .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.aplus .cols i{display:block;height:44px;border-radius:3px;background:var(--line-soft)}
.listing{padding:12px;font-family:var(--mono);font-size:9.5px;color:var(--muted);display:grid;gap:5px;align-content:start}
.listing .t{height:7px;border-radius:2px;background:#3A4670;width:88%}
.listing .t.s{width:60%;background:#2E3855}
.listing .ok{color:#7CD992;display:flex;justify-content:space-between;border-top:1px solid var(--line-soft);padding-top:5px;margin-top:2px}
.banner{background:linear-gradient(120deg,#E00808 0%,#9E0606 60%,#3b0a0a 100%);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;font-family:var(--display);font-weight:800;font-size:15px;line-height:1.05;letter-spacing:-.02em}
.banner small{font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:.12em;opacity:.8;margin-bottom:6px}
.hero-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}
.hero-chips span{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.hero-chips span b{color:var(--text);font-weight:500}

/* v2: outcomes */
.outcomes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:52px}
.oc{background:var(--navy);border:1px solid var(--line-soft);border-radius:8px;padding:30px;display:grid;gap:14px;align-content:start}
.oc .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--red)}
.oc h3{font-size:26px;font-weight:700;line-height:1.1}
.oc p{margin:0;color:var(--muted);font-size:15.5px}
.oc .how{display:grid;gap:6px;margin-top:4px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:14.5px}
.oc .how span{display:flex;gap:10px}
.oc .how span::before{content:"→";color:var(--red);font-family:var(--mono);flex:none}
